server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:fire;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

drill:
  timeout:
    sweep-ms: 200
